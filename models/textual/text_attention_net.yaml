model: TextAttentionNet
library: torch
epochs: 1
search_space:
  model:
  
  training:
    optimizer: [Adam, RMSprop, SGD]
    optimizer_args: 
      weight_decay: [0.0, 0.0001, 0.001]
      lr: [0.0005, 0.001, 0.005]
    lr_scheduler: [ReduceLROnPlateau]
    lr_scheduler_args:
    batch_size: [16, 32, 64]
    lookback: [20, 30, 40]
    ds_type: TabularDataset

search_args:
  type: random
  n_trials: 4


dataset: 
  name: "data_text.arrow" # be careful, it is a relative path to the root of the project
  class: textual