model: LSTM
library: torch
epochs: 1
search_space:
  model:
    lstm:
      input_size: [42]
      hidden_size: [64, 128, 256]
      num_layers: [1, 2, 3]
      dropout: [0.0, 0.1, 0.2, 0.3]
    fc:
      output_size: [1]
      
  training:
    optimizer: [Adam, RMSprop, SGD]
    optimizer_args: 
      weight_decay: [0.0, 0.0001, 0.001]
      lr: [0.0005, 0.001, 0.005]
    lr_scheduler: [ReduceLROnPlateau]
    lr_scheduler_args:
    batch_size: [16, 32, 64]
    ds_type: TimeSeriesDataset

search_args:
  type: random
  n_trials: 4


dataset: 
  name: "data_price.csv" # be careful, it is a relative path to the root of the project
  class: numerical